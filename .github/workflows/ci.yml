name: ci

# Documentation changes do not need four full TFLite builds. Tag pushes go to
# release.yml instead, which carries no path filter at all: GitHub does not
# evaluate path filters for tag pushes, so one there would read as a condition
# and be silently ignored.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# A push supersedes the run before it on the same branch. Deliberately not in
# release.yml: a tag build that gets cancelled leaves a release with no
# artifacts in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
