name: ci

# Documentation changes do not need four full TFLite builds. Tag pushes are
# handled by release.yml, which carries no path filter, because GitHub does not
# document whether paths-ignore applies to tags and a release that silently
# skips its build would be much worse than a wasted run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

# A push supersedes the run before it on the same branch. Deliberately not in
# release.yml: a tag build that gets cancelled leaves a release with no
# artifacts in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
