name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TFLITE_VER: "2.21.0"

jobs:
  macos:
    runs-on: ${{ matrix.runs_on }}
    name: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs_on: macos-14, triple: aarch64-apple-darwin }
          - { runs_on: macos-15-intel, triple: x86_64-apple-darwin }

    steps:
      - uses: actions/checkout@v7

      - name: Cache TensorFlow sources
        uses: actions/cache@v6
        with:
          path: build/_deps/tensorflow-src
          key: tf-src-${{ env.TFLITE_VER }}

      - name: Install ccache
        run: brew install ccache

      - name: Restore ccache
        id: ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.triple }}-${{ env.TFLITE_VER }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.triple }}-${{ env.TFLITE_VER }}-${{ hashFiles('CMakeLists.txt') }}-
            ccache-${{ matrix.triple }}-${{ env.TFLITE_VER }}-
            ccache-${{ matrix.triple }}-

      - name: Configure ccache
        run: |
          # Through the environment rather than --set-config, which writes a file
          # under whichever directory ccache resolves at the time and that the
          # build then never reads. The path is explicit rather than ~/.cache:
          # the Linux jobs run inside a container where HOME is not the runner's,
          # and a cache step aimed at the wrong directory saves an empty one while
          # reporting nothing wrong.
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=400M" >> $GITHUB_ENV
          ccache --zero-stats

      - name: Build
        run: |
          cmake -S . -B build -D CMAKE_BUILD_TYPE=Release -D TFLITE_VER="${TFLITE_VER}" -D TFLITE_PLUGINS_COREML=OFF -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Verify
        run: |
          cc -o build/load_plugin test/load_plugin.c
          for lib in build/lib/*.dylib; do
            ./scripts/verify_plugin.sh "$lib"
            case "$lib" in
              *metal*) ./build/load_plugin "$lib" --reject-unknown-options ;;
              *)       ./build/load_plugin "$lib" ;;
            esac
          done

      - name: Package
        run: |
          mkdir -p dist/lib && cp build/lib/*.dylib dist/lib/
          PKG="tflite-delegate-plugins-${{ matrix.triple }}-v${TFLITE_VER}.tar.gz"
          tar -C dist -czf "$PKG" lib
          shasum -a 256 "$PKG" | tee "$PKG.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.triple }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

      - name: ccache statistics
        if: always()
        run: |
          ccache --show-stats --verbose | head -20
          # A restored cache with no hits means the path or the key is wrong, and
          # the only symptom is a job quietly as slow as a cold one.
          # cache-matched-key, not cache-hit: the key carries the run id, so it
          # never matches exactly and cache-hit is false on every run.
          if [ -n "${{ steps.ccache.outputs.cache-matched-key }}" ]; then
            # ccache 4 prints "Hits:". ccache 3, which is what ubuntu:20.04
            # carries, prints "cache hit (direct)" and "(preprocessed)".
            # Reading only the former counts every ccache 3 run as zero hits and
            # fails a job whose cache was working fine.
            stats=$(ccache --show-stats)
            hits=$(printf '%s' "$stats" | awk '/^  Hits:/{print $2; exit}')
            if [ -z "$hits" ]; then
              direct=$(printf '%s' "$stats" | awk '/^cache hit \(direct\)/{print $NF; exit}')
              prep=$(printf '%s' "$stats" | awk '/^cache hit \(preprocessed\)/{print $NF; exit}')
              hits=$(( ${direct:-0} + ${prep:-0} ))
            fi
            if [ "${hits:-0}" -eq 0 ]; then
              echo "::error::a ccache cache was restored but nothing hit; check CCACHE_DIR against the cached path"
              exit 1
            fi
          fi


  linux:
    # Native on both arches: GitHub's arm64 runners removed the need to
    # cross-compile, and a cross build would need a host flatc that TFLite
    # demands through TFLITE_HOST_TOOLS_DIR. The ubuntu:20.04 container keeps
    # glibc at 2.31 so the artifacts run on older targets than the runner.
    runs-on: ${{ matrix.runs_on }}
    container: ubuntu:20.04
    name: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, triple: x86_64-linux-gnu, runs_on: ubuntu-latest }
          - { arch: aarch64, triple: aarch64-linux-gnu, runs_on: ubuntu-24.04-arm }

    steps:
      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq build-essential curl git unzip ca-certificates python3 ninja-build binutils ccache
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-$(uname -m).tar.gz" -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz --strip-components=1 -C /usr/local

      - uses: actions/checkout@v7

      - name: Cache TensorFlow sources
        uses: actions/cache@v6
        with:
          path: build/_deps/tensorflow-src
          key: tf-src-${{ env.TFLITE_VER }}-${{ matrix.arch }}

      - name: Restore ccache
        id: ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.triple }}-${{ env.TFLITE_VER }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.triple }}-${{ env.TFLITE_VER }}-${{ hashFiles('CMakeLists.txt') }}-
            ccache-${{ matrix.triple }}-${{ env.TFLITE_VER }}-
            ccache-${{ matrix.triple }}-

      - name: Configure ccache
        run: |
          # Through the environment rather than --set-config, which writes a file
          # under whichever directory ccache resolves at the time and that the
          # build then never reads. The path is explicit rather than ~/.cache:
          # the Linux jobs run inside a container where HOME is not the runner's,
          # and a cache step aimed at the wrong directory saves an empty one while
          # reporting nothing wrong.
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=400M" >> $GITHUB_ENV
          ccache --zero-stats

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -D CMAKE_BUILD_TYPE=Release -D TFLITE_VER="${TFLITE_VER}" -D TFLITE_PLUGINS_COREML=OFF -D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(nproc)

      - name: Verify
        run: |
          cc -o build/load_plugin test/load_plugin.c -ldl
          for lib in build/lib/*.so; do
            ./scripts/verify_plugin.sh "$lib"
            ./build/load_plugin "$lib"
          done

      - name: Package
        run: |
          mkdir -p dist/lib && cp build/lib/*.so dist/lib/
          PKG="tflite-delegate-plugins-${{ matrix.triple }}-v${TFLITE_VER}.tar.gz"
          tar -C dist -czf "$PKG" lib
          sha256sum "$PKG" | tee "$PKG.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.triple }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

      - name: ccache statistics
        if: always()
        run: |
          ccache --show-stats --verbose | head -20
          # A restored cache with no hits means the path or the key is wrong, and
          # the only symptom is a job quietly as slow as a cold one.
          # cache-matched-key, not cache-hit: the key carries the run id, so it
          # never matches exactly and cache-hit is false on every run.
          if [ -n "${{ steps.ccache.outputs.cache-matched-key }}" ]; then
            # ccache 4 prints "Hits:". ccache 3, which is what ubuntu:20.04
            # carries, prints "cache hit (direct)" and "(preprocessed)".
            # Reading only the former counts every ccache 3 run as zero hits and
            # fails a job whose cache was working fine.
            stats=$(ccache --show-stats)
            hits=$(printf '%s' "$stats" | awk '/^  Hits:/{print $2; exit}')
            if [ -z "$hits" ]; then
              direct=$(printf '%s' "$stats" | awk '/^cache hit \(direct\)/{print $NF; exit}')
              prep=$(printf '%s' "$stats" | awk '/^cache hit \(preprocessed\)/{print $NF; exit}')
              hits=$(( ${direct:-0} + ${prep:-0} ))
            fi
            if [ "${hits:-0}" -eq 0 ]; then
              echo "::error::a ccache cache was restored but nothing hit; check CCACHE_DIR against the cached path"
              exit 1
            fi
          fi


  release:
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check the set is complete
        run: |
          cd dist
          ls -l
          # needs: gates on job success, not on a job having produced anything.
          # A release missing a target is silent otherwise.
          expected=4
          found=$(ls -1 *.tar.gz 2>/dev/null | wc -l)
          sums=$(ls -1 *.tar.gz.sha256 2>/dev/null | wc -l)
          if [ "$sums" -ne "$found" ]; then
            echo "::error::$found tarballs but $sums checksum files"
            exit 1
          fi
          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected tarballs, found $found"
            exit 1
          fi
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-linux-gnu aarch64-linux-gnu; do
            ls *"$t"*.tar.gz > /dev/null 2>&1 || { echo "::error::no tarball for $t"; exit 1; }
          done
          # TFLITE_VER reaches this job through workflow-level env; an empty one
          # would put "Built against TensorFlow Lite" with no version in the notes.
          test -n "${TFLITE_VER}" || { echo "::error::TFLITE_VER is empty"; exit 1; }
          echo "complete: $found tarballs for TFLite ${TFLITE_VER}"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          body: |
            Built against **TensorFlow Lite ${{ env.TFLITE_VER }}**.

            A plugin only works with a host built from the same TFLite release.
            Upstream provides no binary-stable delegate interface, and a
            mismatch is undefined behaviour rather than a clean error. Check the host with:

            ```erlang
            tflite_beam:tflite_version().  %% must be <<"${{ env.TFLITE_VER }}">>
            ```

            Each tarball ships its own `.sha256`; check it before loading:

            ```console
            $ sha256sum -c tflite-delegate-plugins-<target>-v${{ env.TFLITE_VER }}.tar.gz.sha256
            ```

            **Do not pass options to the OpenCL plugin.** Upstream's option
            parser tests every key with a bare `strcmp`, which is true on
            mismatch, so each value lands in the wrong field silently. The Metal
            plugin's adaptor is ours and parses its options correctly.
