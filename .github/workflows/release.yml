name: release

on:
  push:
    tags: ["v*"]

env:
  # LITERT_VER is the one a host has to match: the runtime comes from LiteRT's
  # tflite subtree and tflite_beam:tflite_version/0 answers it. TFLITE_VER names
  # the TensorFlow release LiteRT builds against and matches nothing a user sees.
  LITERT_VER: "2.2.0"
  TFLITE_VER: "2.21.0-rc0"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check the set is complete
        run: |
          cd dist
          ls -l
          # needs: gates on job success, not on a job having produced anything.
          # A release missing a target is silent otherwise.
          expected=4
          found=$(ls -1 *.tar.gz 2>/dev/null | grep -vc -- '-debug\.tar\.gz$' || true)
          debug=$(ls -1 *-debug.tar.gz 2>/dev/null | wc -l)
          if [ "$debug" -ne "$expected" ]; then
            echo "::error::expected $expected debug bundles, found $debug"
            exit 1
          fi
          sums=$(ls -1 *.tar.gz.sha256 2>/dev/null | wc -l)
          if [ "$sums" -ne "$((found + debug))" ]; then
            echo "::error::$((found + debug)) tarballs but $sums checksum files"
            exit 1
          fi
          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected tarballs, found $found"
            exit 1
          fi
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-linux-gnu aarch64-linux-gnu; do
            # Named exactly. A glob here also matches the target's debug bundle,
            # so a target whose plugin tarball went missing still passed as long
            # as its symbols arrived.
            for f in "tflite_delegate_plugins-$t.tar.gz" \
                     "tflite_delegate_plugins-$t-debug.tar.gz" \
                     "tflite_delegate_plugins-$t.tar.gz.sha256" \
                     "tflite_delegate_plugins-$t-debug.tar.gz.sha256"; do
              [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
            done
          done
          # LITERT_VER reaches this job through workflow-level env; an empty one
          # would put "Built against LiteRT" with no version in the notes, and
          # the version is the whole of what makes a plugin loadable.
          test -n "${LITERT_VER}" || { echo "::error::LITERT_VER is empty"; exit 1; }
          echo "complete: $found tarballs for LiteRT ${LITERT_VER}"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          body: |
            Built against **LiteRT ${{ env.LITERT_VER }}**.

            A plugin only works with a host built from the same LiteRT release.
            Upstream provides no binary-stable delegate interface, and a
            mismatch is undefined behaviour rather than a clean error. Check the host with:

            ```erlang
            tflite_beam:tflite_version().  %% must be <<"${{ env.LITERT_VER }}">>
            ```

            Debug symbols are published separately as
            `*-debug.tar.gz`, so the plugins themselves stay stripped. Download a
            debug bundle only when you need a readable stack.

            Each tarball ships its own `.sha256`; check it before loading:

            ```console
            $ sha256sum -c tflite_delegate_plugins-<target>.tar.gz.sha256
            ```

            Options passed to the OpenCL plugin do what they say here, which
            is not true of an upstream build: its parser tests every key with a
            bare `strcmp` and so acts on the mismatches, accepting invented keys
            and putting real ones in the wrong field. We patch it at build time.
            See the README for what each plugin accepts.
